services:
  postgres:
    image: postgres:17
    container_name: order-service-db
    environment:
      POSTGRES_DB: order_service
      POSTGRES_USER: order_app
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: "no"

volumes:
  postgres_data: